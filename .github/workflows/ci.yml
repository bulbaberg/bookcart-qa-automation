
name: BookCart CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Express"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Проверка контейнера SQL Server
        run: docker ps -a
      - name: Скачиваем репозиторий проекта BookCartTest
        uses: actions/checkout@v7
      - name: Скачиваем проект BookCart из репозитория AnkitSharma-007
        uses: actions/checkout@v7
        with:
          repository: AnkitSharma-007/BookCart
          path: bookcart-app
      - name: Проверяем ресурсы BookCart
        run: ls -l bookcart-app/BookCart/BookCart.csproj
      - name: Устанавливаем .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Запускаем сборку backend-а
        run: dotnet build bookcart-app/BookCart/BookCart.csproj --configuration Release
      - name: Устанавливаем Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Проверка компиляции тестов
        run: mvn test-compile
